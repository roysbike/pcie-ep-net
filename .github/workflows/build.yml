name: build

on:
  push:
  pull_request:

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v=${GITHUB_REF_NAME#v}
          else
            v=$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')
          fi
          echo "version=${v}" | tee -a "${GITHUB_OUTPUT}"

  root-complex:
    name: Cluster Box helper (MT7620A)
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu
      - name: Build openmiop-rc and omi-peek
        working-directory: userspace
        run: make
      - name: Check the binaries
        working-directory: userspace
        run: |
          file openmiop-rc | grep -E 'MIPS|32-bit'
          file omi-peek | grep -E 'MIPS|32-bit'
      - name: Package
        run: |
          name=openmiop-${VERSION}-clusterbox-bmc-mipsel
          mkdir -p "pkg/${name}" dist
          cp userspace/openmiop-rc userspace/omi-peek "pkg/${name}/"
          cp scripts/openmiop.init "pkg/${name}/openmiop.init"
          cat > "pkg/${name}/README.txt" <<EOT
          openmiop ${VERSION}: Cluster Box BMC helper (OpenWrt, MT7620A, mipsel soft-float)
          Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}

          Only needed on BMC firmware without the openmiop package.
            cp openmiop-rc /usr/bin/ && chmod 755 /usr/bin/openmiop-rc
            cp openmiop.init /etc/init.d/openmiop && chmod 755 /etc/init.d/openmiop
            /etc/init.d/openmiop enable && /etc/init.d/openmiop start
          EOT
          sed -i 's/^          //' "pkg/${name}/README.txt"
          tar -C pkg --owner=0 --group=0 -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v7
        with:
          name: bmc
          path: dist/
          if-no-files-found: error

  endpoint:
    name: Endpoint module, upstream 6.1 compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
      - name: Upstream 6.1 headers
        run: |
          git clone --depth 1 --branch linux-6.1.y \
            https://github.com/gregkh/linux.git "${RUNNER_TEMP}/linux"
          make -C "${RUNNER_TEMP}/linux" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -C "${RUNNER_TEMP}/linux" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
      - name: Build openmiop-ep.ko
        working-directory: drivers/openmiop
        run: |
          make KDIR="${RUNNER_TEMP}/linux" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          test -f openmiop-ep.ko

  talos-kernel:
    name: Endpoint and Blade 3 modules, Linux 6.18 (Talos) compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
      - name: Upstream 6.18 tree
        run: |
          git clone --depth 1 --branch linux-6.18.y \
            https://github.com/gregkh/linux.git "${RUNNER_TEMP}/linux"
          make -C "${RUNNER_TEMP}/linux" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -C "${RUNNER_TEMP}/linux" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
      - name: Build openmiop-ep.ko, blade3-leds.ko, blade3-nvme-recover.ko
        # modules_prepare leaves no Module.symvers: unresolved kernel
        # symbols are expected, the check is that everything compiles.
        env:
          KBUILD_MODPOST_WARN: "1"
        run: |
          for d in drivers/openmiop drivers/blade3; do
            make -C "${d}" KDIR="${RUNNER_TEMP}/linux" \
              ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          done
          test -f drivers/openmiop/openmiop-ep.ko
          test -f drivers/blade3/blade3-leds.ko
          test -f drivers/blade3/blade3-nvme-recover.ko

  dkms-deb:
    name: DKMS package
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - run: scripts/build-dkms-deb.sh "${{ needs.version.outputs.version }}" dist
      - run: dpkg-deb -I dist/*.deb && dpkg-deb -c dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/
          if-no-files-found: error

  dkms-install:
    name: DKMS install on ${{ matrix.os }}
    needs: dkms-deb
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Debian 12
            image: debian:12
            headers: linux-headers-arm64
          - os: Debian 13
            image: debian:13
            headers: linux-headers-arm64
          - os: Ubuntu 22.04 (HWE kernel)
            image: ubuntu:22.04
            headers: linux-headers-generic-hwe-22.04
          - os: Ubuntu 24.04
            image: ubuntu:24.04
            headers: linux-headers-generic
          - os: Ubuntu 26.04
            image: ubuntu:26.04
            headers: linux-headers-generic
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: Kernel headers and dkms
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends dkms build-essential ${{ matrix.headers }} iproute2 kmod
          ls /lib/modules
      - name: Install the package (DKMS builds the module)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./dist/openmiop-dkms_*_all.deb
          dkms status
      - name: Check the built module
        run: |
          set -e
          n=0
          for k in $(ls /lib/modules); do
            [ -e "/lib/modules/$k/build" ] || continue
            ko=$(find "/lib/modules/$k/updates" -name 'openmiop-ep.ko*' | head -n1)
            test -n "$ko" || { echo "no module for $k"; exit 1; }
            modinfo "$ko" | grep -E '^(vermagic|alias|license)'
            modinfo -F vermagic "$ko" | grep -q "^$k "
            n=$((n + 1))
          done
          test "$n" -ge 1
      - name: Remove the package
        run: |
          apt-get remove -y openmiop-dkms
          ! find /lib/modules -name 'openmiop-ep.ko*' | grep -q .

  mixtile-os:
    # Mixtile OS (github.com/mixtile-rockchip/mixtile-os): the kernel
    # headers, DTB and u-boot-menu config come from the released Blade 3
    # image. Its headers carry x86-64 fixdep/modpost (fix-host-tools.sh)
    # and its U-Boot no longer rewrites pcie@fe150000 (overlay).
    name: DKMS install on Mixtile OS ${{ matrix.os }}
    needs: dkms-deb
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu 26.04 (v2026.11.09)
            image: ubuntu:26.04
            release: v2026.11.09
            file: ubuntu-26.04-server-arm64-mixtile-blade3.img.xz
            sha256: 2075f4d807d605af72e4ecb2a9cc145a968a26e74db0cede8331befe65e7f98a
            kver: 6.1.172-rockchip-vendor
    env:
      KVER: ${{ matrix.kver }}
    steps:
      - name: Tools, dkms and u-boot-menu
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils e2fsprogs \
            fdisk device-tree-compiler dkms build-essential u-boot-menu iproute2 kmod
          gcc --version | head -n1
      - uses: actions/cache@v6
        id: cache
        with:
          path: mixtile-os
          key: mixtile-os-${{ matrix.release }}-${{ matrix.sha256 }}
      - name: Take headers, DTB and boot config from the image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p mixtile-os/root
          curl -fsSL -o img.xz \
            "https://github.com/mixtile-rockchip/mixtile-os/releases/download/${{ matrix.release }}/${{ matrix.file }}"
          echo "${{ matrix.sha256 }}  img.xz" | sha256sum -c
          xz -d img.xz
          off=$(sfdisk -d img | sed -n 's/.*start= *\([0-9]*\),.*name="writable".*/\1/p')
          test -n "$off"
          r="img?offset=$((off * 512))"
          d() { debugfs -R "$1" "$r"; }
          mkdir -p mixtile-os/root/usr/src "mixtile-os/root/usr/lib/linux-image-${KVER}/rockchip" \
            mixtile-os/root/usr/share/u-boot-menu/conf.d mixtile-os/root/etc/kernel
          d "rdump /usr/src/linux-headers-${KVER} mixtile-os/root/usr/src"
          d "dump /usr/lib/linux-image-${KVER}/rockchip/rk3588-mixtile-blade3.dtb mixtile-os/root/usr/lib/linux-image-${KVER}/rockchip/rk3588-mixtile-blade3.dtb"
          d "dump /usr/share/u-boot-menu/conf.d/mixtile.conf mixtile-os/root/usr/share/u-boot-menu/conf.d/mixtile.conf"
          d "dump /etc/kernel/cmdline mixtile-os/root/etc/kernel/cmdline"
          rm -f img
      - name: Install the image files
        run: |
          set -e
          cp -a mixtile-os/root/. /
          mkdir -p "/lib/modules/${KVER}" /boot
          ln -sfn "/usr/src/linux-headers-${KVER}" "/lib/modules/${KVER}/build"
          : > "/boot/vmlinuz-${KVER}"
          : > "/boot/initrd.img-${KVER}"
          # The image ships the cross-built host tools; this is what DKMS meets.
          file_m() { od -An -tx1 -j18 -N2 "$1" | tr -d ' '; }
          echo "fixdep e_machine $(file_m "/usr/src/linux-headers-${KVER}/scripts/basic/fixdep"), /bin/sh $(file_m /bin/sh)"
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - name: Install the package (DKMS builds the module)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./dist/openmiop-dkms_*_all.deb
          dkms status
      - name: Check the module
        run: |
          set -e
          ko=$(find "/lib/modules/${KVER}/updates" -name 'openmiop-ep.ko*' | head -n1)
          test -n "$ko"
          modinfo "$ko" | grep -E '^(vermagic|alias|license)'
          modinfo -F vermagic "$ko" | grep -q "^${KVER} "
          modinfo -F alias "$ko" | grep -q 'mixtile,miop-ep-rk3588'
      - name: Check the overlay
        run: |
          set -e
          test -f /boot/dtbo/openmiop-cluster-box.dtbo
          grep -E '^\s*fdtoverlays .*/boot/dtbo/openmiop-cluster-box.dtbo' /boot/extlinux/extlinux.conf
          fdtoverlay -i "/usr/lib/linux-image-${KVER}/rockchip/rk3588-mixtile-blade3.dtb" \
            -o /tmp/out.dtb /boot/dtbo/openmiop-cluster-box.dtbo
          test "$(fdtget -t s /tmp/out.dtb /pcie@fe150000 compatible)" = mixtile,miop-ep-rk3588
          test "$(fdtget -t s /tmp/out.dtb /pcie@fe150000 status)" = okay
      - name: Remove the package
        run: |
          apt-get remove -y openmiop-dkms
          ! find /lib/modules -name 'openmiop-ep.ko*' | grep -q .
          test ! -e /boot/dtbo/openmiop-cluster-box.dtbo
          ! grep -q openmiop-cluster-box /boot/extlinux/extlinux.conf

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, root-complex, endpoint, talos-kernel, dkms-deb, dkms-install, mixtile-os]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag, CHANGELOG and release notes agree
        run: |
          grep -q "^## \[${VERSION}\] - " CHANGELOG.md
          test -s "docs/release-notes/${GITHUB_REF_NAME}.md"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and build record
        working-directory: dist
        run: |
          {
            echo "release: ${GITHUB_REF_NAME}"
            echo "repository: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "commit: ${GITHUB_SHA}"
            echo "ci-run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "protocol: OpenMIOP v4"
          } > BUILD-INFO.txt
          sha256sum -- *.deb *.tar.gz BUILD-INFO.txt > SHA256SUMS
          cat BUILD-INFO.txt SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${GITHUB_REF_NAME}" in *-*) pre=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag $pre \
            --title "openmiop ${GITHUB_REF_NAME}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md" \
            dist/*.deb dist/*.tar.gz dist/BUILD-INFO.txt dist/SHA256SUMS
