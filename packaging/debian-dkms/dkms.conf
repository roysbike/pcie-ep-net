PACKAGE_NAME="openmiop"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="openmiop-ep"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
# Kernel headers from a cross "make bindeb-pkg" (Mixtile OS) carry x86-64
# fixdep/modpost: rebuild them for this machine first (no-op elsewhere).
PRE_BUILD="fix-host-tools.sh ${kernel_source_dir}"
AUTOINSTALL="yes"
